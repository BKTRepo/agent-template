# =============================================================================
# 前后端分离标准部署: nginx 托管前端构建产物 + 反代后端 API
#
# 用法: 本文件放入 /etc/nginx/conf.d/ 下(如 rag.conf), 随主配置 http{} 块加载;
#       修改 root 为实际部署路径后执行 nginx -t && nginx -s reload
#
# 拓扑: 浏览器 --80--> nginx --127.0.0.1:8519--> 后端(gunicorn/uvicorn)
#       前端产物 = frontend 目录执行 npm run build 输出的 frontend/dist
#       (前端为 HeroUI v3 版, 兼容无网环境旧版 Chrome/Edge 90+;
#        样式以 app.css + fonts/ 本地文件直连, 无 JS 注入、无外网依赖)
# =============================================================================

# 后端上游(nginx 与后端同机部署; 此时后端可只绑 127.0.0.1, 不对外暴露)
upstream rag_backend {
    server 127.0.0.1:8519;
    keepalive 32;
}

server {
    listen 80;                      # 无外网内网环境直接用 80; 如需其他端口改这里
    server_name _;

    # ---- 前端构建产物(部署时把 frontend/dist 目录整个放到该路径) ----
    root /opt/rag/frontend/dist;  # TODO: 改成实际部署路径
    index index.html;

    # 上传上限: 与后端 RAG_MAX_UPLOAD_MB=200 对齐, 留余量
    client_max_body_size 210m;

    # 防 MIME 嗅探: 避免"HTML 被当 CSS/JS 解析"类隐性故障
    add_header X-Content-Type-Options nosniff;

    # 局域网文本类资源压缩
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---- 前端页面: 真实文件优先, 未命中回退 index.html(SPA 兜底) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存: 保证发版后用户立刻拿到新哈希文件名
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # app.css / fonts 文件名不带哈希、随版本更新, 同样不缓存(每次协商验证)
    location = /app.css {
        add_header Cache-Control "no-cache";
    }
    location /fonts/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite 构建产物文件名带内容哈希, 可长期强缓存; 缺失即 404(不回退 HTML)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 后端 API ----
    # 聊天接口为 SSE 流式(EventSourceResponse): 必须关缓冲, 否则事件被攒住不推送
    location /api/ {
        proxy_pass http://rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # RAG 解析/问答耗时较长, 放宽超时避免 504
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- 离线接口文档及其静态资源 ----
    location ^~ /docs {
        proxy_pass http://rag_backend;
        proxy_set_header Host $host;
    }
    location ^~ /redoc {
        proxy_pass http://rag_backend;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://rag_backend;
        proxy_set_header Host $host;
    }
    location ^~ /swagger-assets/ {
        proxy_pass http://rag_backend;
        proxy_set_header Host $host;
    }

    # 健康检查(运维/监控用)
    location = /health {
        proxy_pass http://rag_backend;
        proxy_set_header Host $host;
    }
}
