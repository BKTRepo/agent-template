[project]
name = "agent-template"
version = "0.1.0"
description = "通用 FastAPI 和 Tortoise ORM 后端模板"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aerich==0.9.2",
    "aiofiles==25.1.0",
    "aiosqlite==0.20.0",
    "argon2-cffi==25.1.0",
    "asyncmy==0.2.11",
    "concurrent-log-handler==0.9.29",
    "fastapi==0.136.3",
    "gunicorn==26.0.0; sys_platform != 'win32'",
    "loguru==0.7.3",
    "orjson==3.11.9",
    "pydantic[email]==2.13.4",
    "pydantic-settings==2.14.1",
    "pyjwt==2.13.0",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "tortoise-orm==0.23.0",
    "uvicorn==0.49.0",
    "uvloop==0.22.1; sys_platform != 'win32'",
]

[dependency-groups]
dev = ["httpx==0.28.1"]

[tool.aerich]
tortoise_orm = "configure.project_config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
